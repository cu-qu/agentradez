name: Image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: true
          tags: ghcr.io/cu-qu/agentradez-api:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.agentradez.com
            NEXT_PUBLIC_SITE_URL=https://agentradez.com
          tags: ghcr.io/cu-qu/agentradez-web:${{ github.sha }}
